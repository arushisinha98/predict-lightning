[project]
name = "predict-lightning"
version = "0.1.0"
description = "Lightning Prediction Tool"
readme = "README.md"
requires-python = ">=3.12"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
predict-lightning = { path = ".", editable = true }

[tool.pixi.tasks]
download-data = "python src/preprocess/download.py"
preprocess-hdf5 = "python src/preprocess/preprocess.py"
explore-data = "python src/preprocess/events_eda.py"
explore-train-h5 = "python src/preprocess/eda.py"
train-model = "python src/train/train.py"

[tool.pixi.dependencies]
huggingface_hub = ">=1.8.0,<2"
matplotlib = ">=3.10.7,<4"
pandas = ">=3.0.1,<4"
seaborn = ">=0.13.2,<0.14"
h5py = ">=3.16.0,<4"
numpy = ">=2.4.3,<3"
scipy = ">=1.17.1,<2"
tqdm = ">=4.67.3,<5"
pytorch = ">=2.10.0,<3"
